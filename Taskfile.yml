# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: Runs the core in dev mode
    cmds:
      - go run cmd/vivery/main.go

  infra:
    desc: Runs all needed infra
    cmds:
      - docker compose -f docker-compose.infra.yaml up -d

  migrate:
    desc: Runs all migrations
    cmds:
      - tern migrate --migrations migrations

  ui:
    desc: Runs ui in dev mode
    cmds:
      - bun run dev

  assets:
    desc: Generates all needed PWA assets
    cmds:
      - bunx @vite-pwa/assets-generator --preset minimal-2023 public/logo.svg
