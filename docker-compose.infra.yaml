services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vivery-mediamtx
    restart: unless-stopped
    ports:
      # RTSP
      - "8554:8554"       # RTSP (TCP)
      - "8000:8000/udp"   # RTP (RTSP UDP transport)
      - "8001:8001/udp"   # RTCP (RTSP UDP transport)
      # RTMP
      - "1935:1935"       # RTMP
      # HLS
      - "8888:8888"       # HLS
      # WebRTC
      - "8889:8889"       # WebRTC HTTP
      - "8189:8189/udp"   # WebRTC ICE/UDP
      # SRT
      - "8890:8890/udp"   # SRT
      # Management
      - "9997:9997"       # Control API
      - "9998:9998"       # Metrics (Prometheus)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  postgres:
    image: postgres:17
    container_name: vivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivery
      POSTGRES_PASSWORD: vivery
      POSTGRES_DB: vivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivery"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: vivery-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
