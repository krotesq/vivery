name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Build (noui)
        run: go build -tags noui ./cmd/vivery

      - name: Build with ui
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: go build ./cmd/vivery